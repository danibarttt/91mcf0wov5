<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- solo codice di questo sito; i dati arrivano cifrati dal broker su WebSocket -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src wss:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Casa</title>
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Casa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icona-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="stile.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="barra">
    <h1>Casa</h1>
    <span id="collegamento" class="collegamento" data-stato="collegamento"><i></i><span>…</span></span>
  </header>
  <main id="app"></main>

  <dialog id="conferma">
    <form method="dialog">
      <h2 id="conferma-titolo"></h2>
      <div class="azioni">
        <button value="annulla" class="secondario">Annulla</button>
        <button value="ok" id="conferma-ok" class="primario"></button>
      </div>
    </form>
  </dialog>

  <dialog id="visore" class="visore">
    <div class="visore-testa">
      <h2 id="visore-nome"></h2>
      <button id="visore-chiudi" class="secondario" aria-label="Chiudi">Chiudi</button>
    </div>
    <div class="visore-foto"><img id="visore-img" alt=""><p id="visore-attesa">Chiedo la foto…</p></div>
    <div class="azioni">
      <button id="visore-foto" class="secondario">Nuova foto</button>
      <button id="visore-diretta" class="primario">Diretta</button>
    </div>
    <p class="nota" id="visore-nota"></p>
  </dialog>

  <div id="avviso" class="avviso" role="status" hidden></div>
</body>
</html>
